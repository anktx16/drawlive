# .github/workflows/deploy-production.yml
name: Deploy to Production VM

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
         node-version: 22
         cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm dlx prisma generate --schema=./packages/db/prisma/schema.prisma

      - name: Build with Turbo
        run: pnpm turbo build

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd /var/www/drawlive

            echo "Pulling latest code..."
            git fetch origin production
            git reset --hard origin/production

            echo "Installing dependencies..."
            pnpm install --frozen-lockfile

            echo "Building..."
            pnpm turbo build

            echo "Running Prisma migrations..."
            pnpm dlx prisma generate --schema=./packages/db/prisma/schema.prisma
            pnpm dlx prisma migrate deploy --schema=./packages/db/prisma/schema.prisma

            echo "Reloading PM2 processes..."
            pm2 reload ecosystem.config.js --update-env
            pm2 save

            echo "Deployment complete ✅"